      - heading "Everyone watches the number. Nobody watches the call." [level=2] [ref=e28]
      - paragraph [ref=e29]: Airtel and Jio score callers at the network layer. Truecaller scores reputation. DoT's Fraud Risk Indicator scores numbers for banks. None of them hears the conversation, and one in three victims call the scammer back themselves.
      - paragraph [ref=e30]: Circuit Breaker scores the conversation. A live transcript plus what's happening on the device becomes one number, the coercion index. At seventy, the breaker trips and someone you trust is put between you and the caller.
      - paragraph [ref=e31]: Judges can't experience a real scam, so this site gives you one. The scammer is synthetic. The engine is not.
